<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RANASINGHE MOTORS</title>
<style>
:root{--bg:#0a0a0c;--panel:#16161a;--ink:#f3ecd9;--mute:#a69e88;--line:#2f2b1f;--acc:#d4af37;--accink:#15110a;--warn:#ff9a3c;--tint:#12301f;--okc:#4ade80;--danger:#ff6b6b;--dbg:#3a1616;--wbg:#33210d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0c;--panel:#16161a;--ink:#f3ecd9;--mute:#a69e88;--line:#2f2b1f;--acc:#d4af37;--accink:#15110a;--warn:#ff9a3c;--tint:#12301f;--okc:#4ade80;--danger:#ff6b6b;--dbg:#3a1616;--wbg:#33210d}}
:root[data-theme="dark"]{--bg:#0a0a0c;--panel:#16161a;--ink:#f3ecd9;--mute:#a69e88;--line:#2f2b1f;--acc:#d4af37;--accink:#15110a;--warn:#ff9a3c;--tint:#12301f;--okc:#4ade80;--danger:#ff6b6b;--dbg:#3a1616;--wbg:#33210d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Noto Sans Sinhala","Noto Sans Tamil","Iskoola Pota","Latha","Nirmala UI",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 16px;background:radial-gradient(520px 170px at 15% 100%,rgba(212,175,55,.3),transparent 70%),radial-gradient(420px 150px at 92% 85%,rgba(166,124,0,.28),transparent 70%),#000;color:#fff;border-bottom:3px solid;border-image:linear-gradient(90deg,#7a5c14,#f6e27a 50%,#7a5c14) 1}
h1{font-size:clamp(15px,4.8vw,20px);margin:0;overflow-wrap:anywhere}h2{font-size:16px;margin:0 0 8px}
nav{display:flex;gap:6px;flex-wrap:wrap}
header>nav{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.45)}
nav button{position:relative;overflow:hidden;border-radius:16px;color:#f3ecd9;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.05),0 4px 12px rgba(0,0,0,.35);transition:transform .18s,background .25s,box-shadow .25s}
nav button::before{content:"";position:absolute;left:0;right:0;top:0;height:55%;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0));pointer-events:none;border-radius:inherit}
nav button:hover{transform:translateY(-1px);background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.08))}
nav button:active{transform:scale(.96)}
nav .on{color:#15110a;font-weight:700;background:linear-gradient(135deg,rgba(246,226,122,.95),rgba(212,175,55,.8) 55%,rgba(166,124,0,.85));border-color:rgba(255,236,160,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(120,80,0,.35),0 8px 22px rgba(212,175,55,.35)}
#lang,#pfb{border:1px solid rgba(255,255,255,.25)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
main{padding:16px;max-width:1200px;margin:auto}
.sell{display:grid;grid-template-columns:1fr 360px;gap:16px}
@media(max-width:820px){.sell{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.55);margin-bottom:14px}
aside.card{border-top:5px solid #d4af37}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.primary{background:linear-gradient(135deg,#f6e27a,#d4af37 45%,#a67c00);color:#15110a;border:0;font-weight:700;width:100%;padding:14px;font-size:17px}
.primary:disabled{opacity:.4;cursor:not-allowed}
.green{background:var(--acc);color:var(--accink);border:0;font-weight:600}
.red{color:var(--danger);border-color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.item{text-align:left;padding:12px;display:flex;flex-direction:column;gap:4px;min-height:84px;border:0;border-left:6px solid var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--panel));border-radius:10px}
.c0{--cc:#d4af37}.c1{--cc:#f0d78c}.c2{--cc:#b8860b}.c3{--cc:#e6c35c}.c4{--cc:#c9a227}.c5{--cc:#9c7a1c}
.item .p{color:var(--mute);font-size:13px}.item img{width:100%;height:64px;object-fit:cover;border-radius:6px}.ph{width:44px;height:44px;object-fit:cover;border-radius:8px}#lg{background:#fff;object-fit:contain;padding:2px;width:48px;height:48px}#brand{height:clamp(50px,15vw,72px);width:auto;max-width:100%;display:block;object-fit:contain;animation:bpop 1s cubic-bezier(.2,.9,.3,1.15) both,bglow 4.5s ease-in-out 1s infinite}
.brandw{position:relative;display:inline-block;max-width:100%;overflow:hidden;isolation:isolate;border-radius:6px}
.brandw::after{content:"";position:absolute;inset:0;background:var(--bu) center/100% 100% no-repeat;filter:brightness(2.7) saturate(.45);-webkit-mask-image:linear-gradient(100deg,transparent 44%,#000 50%,transparent 56%);mask-image:linear-gradient(100deg,transparent 44%,#000 50%,transparent 56%);-webkit-mask-size:200% 100%;mask-size:200% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;animation:bsheen 5s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes bpop{from{opacity:0;transform:scale(.82) translateY(-8px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes bglow{0%,100%{filter:drop-shadow(0 0 2px rgba(212,175,55,.15))}50%{filter:drop-shadow(0 0 9px rgba(246,226,122,.55))}}
@keyframes bsheen{0%,55%{-webkit-mask-position:100% 0;mask-position:100% 0}100%{-webkit-mask-position:0 0;mask-position:0 0}}
#brand{cursor:pointer}
#splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(620px 320px at 50% 50%,rgba(212,175,55,.24),transparent 70%),#000;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:sout .6s ease 2.7s forwards}
#splash .sp{position:relative;display:flex;align-items:center;width:min(88vw,620px);isolation:isolate;overflow:hidden}
#splash .sg{width:27.35%;height:auto;animation:sgear 1.5s cubic-bezier(.17,.84,.3,1) both}
#splash .st{width:72.65%;height:auto;clip-path:inset(0 100% 0 0);animation:swipe 1s cubic-bezier(.6,0,.2,1) .9s forwards}
#splash .sh{position:absolute;inset:0;display:flex;align-items:center;pointer-events:none;filter:brightness(2.7) saturate(.45);-webkit-mask-image:linear-gradient(100deg,transparent 44%,#000 50%,transparent 56%);mask-image:linear-gradient(100deg,transparent 44%,#000 50%,transparent 56%);-webkit-mask-size:200% 100%;mask-size:200% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;animation:ssheen 1.1s ease 1.9s forwards}#splash .sh img{height:auto}
@keyframes sgear{0%{opacity:0;transform:rotate(-420deg) scale(.1);filter:blur(6px)}60%{opacity:1;filter:none}100%{opacity:1;transform:none;filter:drop-shadow(0 0 14px rgba(246,226,122,.5))}}
@keyframes swipe{to{clip-path:inset(0 0 0 0)}}
@keyframes ssheen{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes sout{to{opacity:0;visibility:hidden}}.rlg{display:block;margin:0 auto 8px;max-width:120px;max-height:80px}.filebtn{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel)}
.item.low{background:var(--wbg);outline:2px dashed var(--warn);outline-offset:-2px}.item.low .p{color:var(--warn);font-weight:700}
.item:disabled{background:var(--dbg);border-left-color:var(--danger);color:var(--danger);opacity:.75;cursor:not-allowed;outline:0}.item:disabled .p{color:var(--danger)}
.item:active{background:var(--cc);color:#15110a}.item:active .p{color:#15110a}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row .n{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:6px}.qty button{padding:2px 10px;background:var(--acc);color:var(--accink);border:0;font-weight:700}
.tot{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:12px 0;align-items:center}
.tot input,.tot select{width:130px;text-align:right}
.big{font-size:24px;font-weight:700;color:var(--acc)}
#chg{font-weight:700;color:var(--okc);background:var(--tint);padding:2px 8px;border-radius:6px;justify-self:end}#chg.bad{color:var(--danger);background:var(--dbg)}
.empty{color:var(--mute);padding:16px 0;text-align:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-bottom:12px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td button{padding:3px 8px;margin-right:4px}
.lowt{color:var(--warn);font-weight:700}.out{color:var(--danger);font-weight:700}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.kpi div{border-radius:10px;padding:10px;color:#fff;font-size:13px}.kpi b{display:block;font-size:20px}
.bars{display:flex;gap:4px;height:170px;margin-top:8px}
.bars i{flex:1;display:flex;flex-direction:column;justify-content:flex-end;font-style:normal;text-align:center}
.bars span{display:block;border-radius:4px 4px 0 0;min-height:2px}.bars small{font-size:10px;color:var(--mute)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#fk{flex:1;min-width:140px;width:auto}.bar select{width:auto}.bar button{width:auto}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);max-width:340px;width:90%}
pre{font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;margin:0 0 12px}
.kpi div{background:linear-gradient(135deg,#2a2412,#15130d)!important;border:1px solid #4a3d14;color:#e9dfc0!important}.kpi b{color:#f0d78c}.kpi div[style*="#dc2626"]{background:#4a1515!important;border-color:var(--danger)}#pa{display:none}header>nav{flex-basis:100%}#pmenu{position:absolute;right:0;top:48px;min-width:236px;background:rgba(24,24,28,.62);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);color:var(--ink);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 18px 40px rgba(0,0,0,.6);z-index:30}#pmenu button{border-radius:12px}#pmenu button:not(.green){background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}#pmenu .green{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 14px rgba(212,175,55,.3)}#pmenu .red{border-color:rgba(255,107,107,.6)!important}@media print{html,body{height:auto!important;min-height:0!important;margin:0!important;padding:0!important;background:#fff!important}:root{padding:0!important}body>*{display:none!important}body>#pa{display:block!important;color:#000;background:#fff}}
</style>

function showSplash(){var o=$("splash");if(o)o.remove();var d=document.createElement("div");d.id="splash";d.innerHTML='<div class="sp"><img class="sg" alt="" src="'+GEAR+'"><img class="st" alt="" src="'+TXT+'"><div class="sh"><img style="width:27.35%" alt="" src="'+GEAR+'"><img style="width:72.65%" alt="" src="'+TXT+'"></div></div>';d.onclick=function(){d.remove()};d.addEventListener("animationend",function(e){if(e.animationName==="sout")d.remove()});document.body.appendChild(d)}
try{if(!sessionStorage.getItem("splash")){sessionStorage.setItem("splash","1");showSplash()}}catch(e){showSplash()}
$("brand").onclick=showSplash;document.querySelector(".brandw").style.setProperty("--bu","url("+$("brand").src+")");
// ---- cloud sync (active only when this page is served by the Render server) ----
var CLOUD=false,TOK="",BASE=null,VER=0,DIRTY=false,PUSHING=false,syncT=null,pollT=null,LU=null;
try{TOK=sessionStorage.getItem("ptok")||""}catch(e){}
var COLS=["items","sales","cs","exp","co","cl","hold","users"],OBJS=["set","ai","bl","lo"],SCAL=["apin","bn","logo"];
function H(){return {"Content-Type":"application/json","Authorization":"Bearer "+TOK}}
function ul(){return CLOUD&&LU?LU:S.users}
function snap(x){var o={};COLS.forEach(function(c){o[c]={};(x[c]||[]).forEach(function(r){o[c][r.id]=JSON.stringify(r)})});OBJS.concat(SCAL).forEach(function(k){o[k]=JSON.stringify(x[k]===undefined?null:x[k])});return o}
function diff(){var b=BASE||snap({}),n=snap(S),d={a:{},r:{},o:{}},any=false;
  COLS.forEach(function(c){var up=(S[c]||[]).filter(function(r){return b[c][r.id]!==n[c][r.id]}),rm=Object.keys(b[c]).filter(function(id){return !(id in n[c])});if(up.length){d.a[c]=up;any=true}if(rm.length){d.r[c]=rm;any=true}});
  OBJS.concat(SCAL).forEach(function(k){if(b[k]!==n[k]){d.o[k]=S[k];any=true}});return any?d:null}
function applyState(sv){Object.keys(sv).forEach(function(k){if(k!=="ver"&&sv[k]!==undefined)S[k]=sv[k]})}
function mark(ok){var e=$("sy");if(e)e.textContent=CLOUD?(ok?"☁ ✓ "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"☁ ✗"):""}
function sched(){DIRTY=true;clearTimeout(syncT);syncT=setTimeout(push,300)}
function lost(){TOK="";cur=null;clearInterval(pollT);try{sessionStorage.removeItem("ptok");sessionStorage.removeItem("pcur")}catch(e){}render();alert("ඇතුල් වීම කල් ඉකුත් විය. නැවත ඇතුල් වන්න.")}
function refreshUI(){var a=document.activeElement,typing=a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);if(!cur)return;if(tab==="s"){if($("grid")){grid();hstrip()}return}if(!typing&&!$("dlg").open&&!$("dlb").open)render()}
function mergeIn(sv,first){var joined=false;try{joined=localStorage.getItem("pjoin")==="1"}catch(e){}
  var srvHas=(sv.items&&sv.items.length)||(sv.sales&&sv.sales.length),locHas=(S.items&&S.items.length)||(S.sales&&S.sales.length);
  if(first&&!joined&&srvHas&&locHas){COLS.forEach(function(c){var have={};(sv[c]||[]).forEach(function(r){have[r.id]=1});S[c]=(sv[c]||[]).concat((S[c]||[]).filter(function(r){return !have[r.id]}))});OBJS.concat(SCAL).forEach(function(k){if(sv[k]!==undefined)S[k]=sv[k]});BASE=snap(sv)}
  else if(first&&!joined&&!srvHas){BASE=snap({})}
  else{applyState(sv);BASE=snap(S)}
  try{localStorage.setItem("pjoin","1")}catch(e){}save()}
async function pull(first){var r=await fetch("/api/state",{headers:H()});if(r.status===401){lost();throw 0}var j=await r.json();VER=j.ver;mergeIn(j.state,first);mark(true)}
async function push(){if(!CLOUD||!TOK||PUSHING)return;var d=diff();if(!d){DIRTY=false;return}PUSHING=true;var sent=JSON.stringify(S);
  try{var r=await fetch("/api/sync",{method:"POST",headers:H(),body:JSON.stringify({d:d})});if(r.status===401){PUSHING=false;lost();return}var j=await r.json();VER=j.ver;
    if(JSON.stringify(S)===sent){applyState(j.state);BASE=snap(S);DIRTY=false;try{localStorage.setItem("pos2",JSON.stringify(S))}catch(e){}refreshUI()}else{BASE=snap(JSON.parse(sent));sched()}
    mark(true)}catch(e){mark(false);setTimeout(sched,5000)}
  PUSHING=false}
function startPoll(){clearInterval(pollT);pollT=setInterval(async function(){if(!CLOUD||!TOK||PUSHING||DIRTY)return;try{var r=await fetch("/api/state?ver="+VER,{headers:H()});if(r.status===401){lost();return}var j=await r.json();mark(true);if(j.same)return;VER=j.ver;applyState(j.state);BASE=snap(S);try{localStorage.setItem("pos2",JSON.stringify(S))}catch(e){}refreshUI()}catch(e){mark(false)}},6000)}
async function cloudLogin(){var role=lt==="a"?"a":"u",id=role==="u"&&$("lu")?$("lu").value:"",pin=$("lp").value;
  try{var r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({role:role,id:id,pin:pin})}),j=await r.json();
    if(!r.ok){alert(j.err==="rate"?"උත්සාහ කිරීම් වැඩියි. විනාඩි 5කින් නැවත උත්සාහ කරන්න.":"PIN අංකය වැරදියි.");return}
    TOK=j.token;cur=j.user;try{sessionStorage.setItem("ptok",TOK);sessionStorage.setItem("pcur",JSON.stringify(cur))}catch(e){}
    await pull(true);tab="s";render();startPoll()}catch(e){if(e!==0)alert("සර්වරයට සම්බන්ධ විය නොහැක.")}}
async function cloudInit(){try{var r=await fetch("/api/ping"),j=await r.json();CLOUD=!!(j&&j.cloud)}catch(e){CLOUD=false}
  if(!CLOUD)return;
  try{var ur=await fetch("/api/users"),uj=await ur.json();LU=uj.users||[]}catch(e){}
  if(TOK){try{cur=JSON.parse(sessionStorage.getItem("pcur")||"null");if(!cur)throw 0;await pull(true);startPoll()}catch(e){TOK="";cur=null}}
  render()}

render();cloudInit();
